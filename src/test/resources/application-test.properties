spring.datasource.url=jdbc:sqlite:test_memory.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-test-query=SELECT 1
spring.main.web-application-type=none
ai.deepseek.api-key=${DEEPSEEK_API_KEY:test-deepseek-key}
ai.dashscope.api-key=${DASHSCOPE_API_KEY:test-dashscope-key}
app.security.bootstrap-admin.password=${APP_ADMIN_PASSWORD:test-admin-password}
