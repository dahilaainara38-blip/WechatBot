spring.application.name=wechat-bot
spring.config.import=optional:file:./.env[.properties]

# 管理页端口（多机器人扫码登录入口）
server.port=8080

# 管理后台会话与安全配置
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.security.bootstrap-admin.username=${APP_ADMIN_USERNAME:admin}
app.security.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
app.security.max-bots-per-user=3
app.security.max-pending-slots-per-user=2
app.security.login-max-failures=5
app.security.login-lock-seconds=900

# ============================================================
# DeepSeek 配置（主对话模型，OpenAI 兼容协议）
# API Key 从 https://platform.deepseek.com/ 获取
# ============================================================
ai.deepseek.api-key=${DEEPSEEK_API_KEY}
# 模型：deepseek-chat（V3）、deepseek-reasoner（R1）
ai.deepseek.model-name=deepseek-chat
ai.deepseek.base-url=https://api.deepseek.com

# ============================================================
# 阿里云百炼 (DashScope) 配置（仅多模态：图片/视频识别、语音合成与识别）
# ============================================================
# 百炼 API Key，从 https://bailian.console.aliyun.com/ 获取
ai.dashscope.api-key=${DASHSCOPE_API_KEY}

# ============================================================
# WeChat ILINK SDK 配置
# ============================================================
ilink.login-timeout-ms=180000
ilink.heartbeat-enabled=true
ilink.heartbeat-interval-ms=30000

# ============================================================
# 日志配置
# ============================================================
logging.level.com.github.wechat.ilink=WARN

# ============================================================
# SQLite 数据源（长期记忆）
# ============================================================
spring.datasource.url=jdbc:sqlite:memory.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# HikariCP 兼容 SQLite 配置（单连接模式）
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-test-query=SELECT 1

# ============================================================
# 多模态配置
# ============================================================
# 视觉理解模型（图片/视频帧识别）
ai.dashscope.vl-model-name=qwen-vl-max
# TTS 语音合成模型
ai.dashscope.tts-model=cosyvoice-v1
# TTS 语音角色（longxiaochun=龙小淳，温柔女声，适合苏念人设）
ai.dashscope.tts-voice=longxiaochun
# 男声音色（人设性别为男性时使用）
ai.dashscope.tts-male-voice=longxiaocheng
# TTS 输出格式
ai.dashscope.tts-format=PCM_24000HZ_MONO_16BIT
# ASR 语音识别模型
ai.dashscope.asr-model=paraformer-v2
# 是否启用语音回复（true=AI回复有时以语音发送，false=纯文本）
ai.multimodal.voice-reply-enabled=true
# 语音回复概率（0-1，苏念偶尔发语音才有真实感）
ai.multimodal.voice-reply-probability=0.3
# 媒体文件临时目录
ai.multimodal.temp-dir=work/media
