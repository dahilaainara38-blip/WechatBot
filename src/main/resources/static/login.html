<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 微信机器人管理</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f6f8;
            color: #1f2329;
        }
        main {
            width: min(380px, 100%);
            background: #fff;
            border: 1px solid #e8eaee;
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(31, 35, 41, .06);
        }
        h1 { margin: 0 0 6px; font-size: 20px; font-weight: 650; letter-spacing: 0; }
        .subtitle { margin: 0 0 24px; color: #6b7280; font-size: 14px; }
        label { display: block; margin: 16px 0 7px; font-size: 13px; font-weight: 550; }
        input {
            width: 100%;
            height: 42px;
            border: 1px solid #d9dde5;
            border-radius: 6px;
            padding: 0 12px;
            font: inherit;
            font-size: 14px;
            background: #fff;
        }
        input:focus { outline: 2px solid rgba(22, 104, 220, .18); border-color: #1668dc; }
        button {
            width: 100%;
            height: 42px;
            margin-top: 22px;
            border: 0;
            border-radius: 6px;
            background: #1668dc;
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #3d8bff; }
        button:disabled { opacity: .55; cursor: wait; }
        button:focus-visible, input:focus-visible { outline-offset: 2px; }
        .error { min-height: 20px; margin-top: 14px; color: #c9362b; font-size: 13px; line-height: 1.5; }
        .hint { margin: 6px 0 0; color: #9aa0a6; font-size: 12px; }
        .switch { margin-top: 16px; text-align: center; font-size: 13px; color: #6b7280; }
        .switch a { color: #1668dc; cursor: pointer; text-decoration: none; }
        .switch a:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            body { padding: 16px; }
            main { padding: 22px 20px; }
        }
    </style>
    <script src="/auth.js" defer></script>
</head>
<body>
<main>
    <h1>微信机器人管理</h1>
    <p class="subtitle" id="subtitle">登录你的管理账号</p>
    <form id="loginForm">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required autofocus maxlength="32">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="loginButton" type="submit">登录</button>
        <div class="error" id="loginError" role="alert"></div>
    </form>
    <form id="registerForm" hidden>
        <label for="regUsername">用户名</label>
        <input id="regUsername" name="username" autocomplete="username" required maxlength="32">
        <p class="hint">3-32 位字母、数字、点、下划线或短横线</p>
        <label for="regPassword">密码</label>
        <input id="regPassword" name="password" type="password" autocomplete="new-password" required>
        <p class="hint">至少 12 个字符</p>
        <label for="regPasswordConfirm">确认密码</label>
        <input id="regPasswordConfirm" type="password" autocomplete="new-password" required>
        <button id="registerButton" type="submit">注册</button>
        <div class="error" id="registerError" role="alert"></div>
    </form>
    <p class="switch"><a id="switchLink">没有账号？注册一个</a></p>
</main>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const subtitle = document.getElementById('subtitle');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const switchLink = document.getElementById('switchLink');

        let registering = false;
        switchLink.addEventListener('click', () => {
            registering = !registering;
            loginForm.hidden = registering;
            registerForm.hidden = !registering;
            subtitle.textContent = registering ? '创建一个新账号' : '登录你的管理账号';
            switchLink.textContent = registering ? '已有账号？去登录' : '没有账号？注册一个';
            (registering ? document.getElementById('regUsername') : document.getElementById('username')).focus();
        });

        const loginButton = document.getElementById('loginButton');
        const loginError = document.getElementById('loginError');
        loginForm.addEventListener('submit', async event => {
            event.preventDefault();
            loginButton.disabled = true;
            loginButton.textContent = '登录中…';
            loginError.style.color = '';
            loginError.textContent = '';
            try {
                const response = await apiFetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                    body: new URLSearchParams({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                if (!response.ok) throw new Error(await readApiError(response));
                cachedCsrfToken = null;
                window.location.replace('/');
            } catch (e) {
                loginError.textContent = e.message;
                loginButton.disabled = false;
                loginButton.textContent = '登录';
            }
        });

        const registerButton = document.getElementById('registerButton');
        const registerError = document.getElementById('registerError');
        registerForm.addEventListener('submit', async event => {
            event.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;
            registerError.textContent = '';
            if (password !== confirm) {
                registerError.textContent = '两次输入的密码不一致';
                return;
            }
            registerButton.disabled = true;
            registerButton.textContent = '注册中…';
            try {
                const response = await apiFetch('/api/auth/register', {
                    method: 'POST',
                    json: { username, password }
                });
                if (!response.ok) throw new Error(await readApiError(response));
                switchLink.click();
                document.getElementById('username').value = username;
                loginError.style.color = '#1a7f37';
                loginError.textContent = '注册成功，请登录';
            } catch (e) {
                registerError.textContent = e.message;
            } finally {
                registerButton.disabled = false;
                registerButton.textContent = '注册';
            }
        });
    });
</script>
</body>
</html>
